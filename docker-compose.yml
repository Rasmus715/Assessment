networks:
  app-network:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5674:5672"
      - "15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always
    networks:
      - app-network

  weakapp:
    image: fra.vultrcr.com/arreisregistry/weakapp:latest
    container_name: weakapp
    ports:
      - "8080:8080"
    restart: always
    networks:
      - app-network

  ingestor:
    image: ingestor
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      WEAKAPP_BASE_URL: "http://weakapp:8080"
    depends_on:
      - rabbitmq
      - weakapp
    networks:
      - app-network

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: rasmus
      DOCKER_INFLUXDB_INIT_BUCKET: weakapp_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: supersecret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: always
    networks:
      - app-network

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINUSERNAME=admin
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=QG+oFpLwetnVrzFQ+AuAwMFgFHKoksi0aONSZTfsf8GwoJ7bOCIoqKC7lse8jK+5ZCLx4iEL3TtMQuTN7EvprFckWTw0nMi9FLRRNSMksxAv
    restart: unless-stopped
    volumes:
      - ./seq-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app-network

  seqcli:
    image: datalust/seqcli:latest
    command: apikey create -t newapikey --token SeqTokenForApps12345 -s http://seq --permissions="read,write,project,organization,system" --connect-username admin --connect-password admin1234
    depends_on:
      - seq
    restart: on-failure
    networks:
      - app-network

  processor:
    image: processor
    container_name: processor
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_QUEUE: ingestor.queue
      RABBITMQ_PORT: 5672 
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest

      WEAKAPP_BASE_URL: "http://weakapp:8080"

      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: supersecret-token
      INFLUXDB_ORG: rasmus
      INFLUXDB_BUCKET: weakapp_data

      SEQ_SERVER_URL: http://seq:5341
    depends_on:
      - rabbitmq
      - influxdb
      - seq
    restart: unless-stopped
    networks:
      - app-network

volumes:
  influxdb_data:
