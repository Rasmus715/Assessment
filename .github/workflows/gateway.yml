name: Gateway Build and Test

on:
  push:
    branches: [ main, develop, master ]
    paths:
      - 'Gateway/**'
      - 'Gateway.Test/**'
      - 'Assessment.sln'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [ main, develop, master ]
    paths:
      - 'Gateway/**'
      - 'Gateway.Test/**'
      - 'Assessment.sln'
      - '.github/workflows/gateway.yml'

env:
  DOTNET_VERSION: '10.0.x'
  GATEWAY_PROJECT_PATH: 'Gateway/Gateway.csproj'
  GATEWAY_TEST_PROJECT_PATH: 'Gateway.Test/Gateway.Tests.csproj'

jobs:
  build:
    name: Build Gateway
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.GATEWAY_PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.GATEWAY_PROJECT_PATH }} --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gateway-build
          path: |
            Gateway/bin/
            Gateway/obj/
          retention-days: 1

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.GATEWAY_TEST_PROJECT_PATH }}

      - name: Run unit tests
        run: dotnet test ${{ env.GATEWAY_TEST_PROJECT_PATH }} 
          --configuration Release 
          --no-restore 
          --filter "FullyQualifiedName!~Integration" 
          --verbosity normal
          --logger "trx;LogFileName=test-results-unit.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            **/test-results-unit.trx
            **/coverage.cobertura.xml
          retention-days: 7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/test-results-unit.trx'

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore dependencies
        run: dotnet restore ${{ env.GATEWAY_TEST_PROJECT_PATH }}

      - name: Run integration tests
        run: dotnet test ${{ env.GATEWAY_TEST_PROJECT_PATH }} 
          --configuration Release 
          --no-restore 
          --filter "FullyQualifiedName~Integration" 
          --verbosity normal
          --logger "trx;LogFileName=test-results-integration.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            **/test-results-integration.trx
            **/coverage.cobertura.xml
          retention-days: 7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/test-results-integration.trx'

